# pytest configuration for Legislatie API Client

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p tests.conftest
markers =
    integration: integration test (requires network access)
    slow: slow test
    unit: unit test (no external dependencies)
    cache: test involving cache
    scraper: test involving HTML scraper
    soap: test involving SOAP API
    streamlit: test involving Streamlit UI

# Logging configuration
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Test coverage (optional)
# --cov=.
# --cov-report=term-missing
# --cov-report=html

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning