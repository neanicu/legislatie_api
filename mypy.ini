[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
no_implicit_optional = True

# Suppress specific error types that are too noisy for existing code
disable_error_code = attr-defined, index, assignment

# Exclude test files and third-party modules
exclude = 
    .git
    __pycache__
    .pytest_cache
    .venv
    .env
    .github
    *.egg-info
    build
    dist
    tests
    test_*.py
    test_health.py
    test_streamlit_import.py

[mypy-cache]
ignore_errors = True

[mypy-legislatie_client]
ignore_errors = True

[mypy-legislatie_scraper]
ignore_errors = True

[mypy-streamlit_app]
ignore_errors = True