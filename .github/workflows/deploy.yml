name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_PATH: /srv/legislatie_api

jobs:
  # Run tests first
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -m "not integration" --tb=short -v

  # Build and push Docker image
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t legislatie-api:latest .

      - name: Run smoke test
        run: |
          docker run --rm legislatie-api:latest python -c "from legislatie_client import LegislatieClient; print('Import successful')"

  # Deploy to VPS
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            
            # Pull latest changes
            git pull origin main
            
            # Create logs directory if not exists
            mkdir -p logs
            
            # Build and restart containers
            docker compose --profile production up -d --build
            
            # Clean up old images
            docker image prune -f
            
            # Health check
            sleep 10
            docker ps | grep legislatie-api
            
            echo "Deployment completed successfully!"

  # Notify on failure
  notify-failure:
    runs-on: ubuntu-latest
    needs: [test, build, deploy]
    if: failure()
    steps:
      - name: Notify deployment failure
        run: |
          echo "Deployment failed! Check the workflow logs for details."
          # Add notification logic here (Slack, Discord, email, etc.)
